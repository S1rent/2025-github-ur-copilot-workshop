<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Particle background container -->
    <div id="particles-container"></div>
    
    <!-- Ripple effect container -->
    <div id="ripple-container"></div>

    <header>
        <h1>🍅 Pomodoro Timer</h1>
        <p class="subtitle">Stay focused and productive</p>
    </header>

    <main>
        <div class="timer-card">
            <div class="timer-header">
                <span id="mode-indicator" class="mode-badge">Work Session</span>
                <span class="session-counter">Session: <span id="session-count">0</span></span>
            </div>

            <div class="timer-display">
                <!-- SVG Circular Progress Bar -->
                <svg class="progress-ring" viewBox="0 0 200 200">
                    <!-- Background circle -->
                    <circle 
                        class="progress-ring-bg" 
                        cx="100" 
                        cy="100" 
                        r="90"
                        fill="none"
                        stroke="#3a3a4a"
                        stroke-width="8"
                    />
                    <!-- Progress circle -->
                    <circle 
                        id="progress-circle"
                        class="progress-ring-circle" 
                        cx="100" 
                        cy="100" 
                        r="90"
                        fill="none"
                        stroke="url(#progress-gradient)"
                        stroke-width="8"
                        stroke-linecap="round"
                        transform="rotate(-90 100 100)"
                    />
                    <!-- Gradient definition -->
                    <defs>
                        <linearGradient id="progress-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop id="gradient-stop-1" offset="0%" style="stop-color:#4F9DFF"/>
                            <stop id="gradient-stop-2" offset="100%" style="stop-color:#4F9DFF"/>
                        </linearGradient>
                    </defs>
                </svg>
                
                <div class="timer-content">
                    <div id="timer" class="timer-text">25:00</div>
                    <div id="status" class="status-text">▶ Ready to start</div>
                </div>
            </div>

            <div class="controls">
                <button id="start-btn" class="btn btn-primary">
                    <span class="btn-icon">▶</span> Start
                </button>
                <button id="reset-btn" class="btn btn-secondary">
                    <span class="btn-icon">↻</span> Reset
                </button>
                <button id="skip-btn" class="btn btn-secondary">
                    <span class="btn-icon">⏭</span> Skip
                </button>
            </div>

            <button id="settings-btn" class="btn btn-settings">
                <span class="btn-icon">⚙</span> Settings
            </button>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Settings</h2>
                <div class="setting-group">
                    <label for="work-duration">Work Duration (minutes)</label>
                    <input type="number" id="work-duration" value="25" min="1" max="60">
                </div>
                <div class="setting-group">
                    <label for="break-duration">Short Break (minutes)</label>
                    <input type="number" id="break-duration" value="5" min="1" max="30">
                </div>
                <div class="setting-group">
                    <label for="long-break-duration">Long Break (minutes)</label>
                    <input type="number" id="long-break-duration" value="20" min="1" max="60">
                </div>
                <div class="modal-buttons">
                    <button id="save-settings" class="btn btn-primary">Save</button>
                    <button id="cancel-settings" class="btn btn-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/timer.js') }}"></script>
</body>
</html>
